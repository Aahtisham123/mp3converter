<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="t d">
  <title id="t">YouTube to MP3 converter</title>
  <desc id="d">A video player with a pasted link turns into an MP3 audio file at 320 kbps.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6d5dfc" flood-opacity=".15"/></filter>
  </defs>
  <rect width="960" height="340" rx="28" fill="#f7f6ff"/>
  <path d="M0 260c160-50 300 30 480 6s300-60 480-14v88H0z" fill="#ece8ff"/>
  <g fill="#c7c9f5"><circle cx="880" cy="40" r="3"/><circle cx="904" cy="40" r="3"/><circle cx="880" cy="64" r="3"/><circle cx="904" cy="64" r="3"/></g>

  <!-- video card -->
  <g filter="url(#s)"><rect x="60" y="56" width="330" height="228" rx="24" fill="#fff"/></g>
  <rect x="82" y="78" width="286" height="150" rx="16" fill="#1f2937"/>
  <rect x="82" y="78" width="286" height="150" rx="16" fill="url(#g)" opacity=".35"/>
  <rect x="190" y="125" width="70" height="50" rx="14" fill="url(#r)"/>
  <path d="M216 138v24l20-12z" fill="#fff"/>
  <rect x="98" y="210" width="254" height="5" rx="2.5" fill="#ffffff" opacity=".35"/>
  <rect x="98" y="210" width="150" height="5" rx="2.5" fill="#fff"/>
  <rect x="82" y="242" width="286" height="28" rx="14" fill="#f3efff"/>
  <path d="M100 256a5 5 0 0 0 7 0l4-4a5 5 0 0 0-7-7l-1 1m3 3a5 5 0 0 0-7 0l-4 4a5 5 0 0 0 7 7l1-1" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linecap="round" transform="translate(4 0)"/>
  <text x="126" y="261" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6b7280">youtube.com/watch?v=…</text>

  <!-- converter -->
  <g stroke="#c4b5fd" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" fill="none">
    <path d="M400 170h52"/><path d="M548 170h52"/>
  </g>
  <circle cx="500" cy="170" r="58" fill="#a78bfa" opacity=".25"/>
  <circle cx="500" cy="170" r="44" fill="url(#g)"/>
  <g stroke="#fff" stroke-width="5" stroke-linecap="round"><path d="M478 162v16M490 150v40M502 158v24M514 146v48M526 162v16"/></g>

  <!-- mp3 card -->
  <g filter="url(#s)"><rect x="610" y="56" width="290" height="228" rx="24" fill="#fff"/></g>
  <path d="M700 82h66l34 34v104a12 12 0 0 1-12 12h-88a12 12 0 0 1-12-12V94a12 12 0 0 1 12-12z" fill="url(#g)"/>
  <path d="M766 82v22a12 12 0 0 0 12 12h22z" fill="#fff" opacity=".35"/>
  <path d="M736 196v-52l34-7v46" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="728" cy="198" r="10" fill="#fff"/><circle cx="762" cy="186" r="10" fill="#fff"/>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="755" y="258" font-size="20" font-weight="800" fill="#111827">MP3 · 320 kbps</text>
  </g>
  <path d="M600 110l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#a78bfa"/>
