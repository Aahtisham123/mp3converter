    <rect x="74" y="70" width="64" height="30" rx="10" fill="url(#g)"/><text x="106" y="91" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">TXT</text>
    <text x="74" y="130" font-size="17" font-weight="700" fill="#111827">Plain text</text>
    <text x="74" y="152" font-size="13" fill="#6b7280">Notes, articles, Word, email</text>
    <rect x="74" y="176" width="210" height="9" rx="4.5" fill="#e5e7eb"/><rect x="74" y="194" width="190" height="9" rx="4.5" fill="#e5e7eb"/><rect x="74" y="212" width="200" height="9" rx="4.5" fill="#e5e7eb"/><rect x="74" y="236" width="170" height="9" rx="4.5" fill="#e5e7eb"/><rect x="74" y="254" width="110" height="9" rx="4.5" fill="#c4b5fd"/>
    <g filter="url(#s)"><rect x="350" y="46" width="260" height="236" rx="24" fill="#fff"/></g>
    <rect x="374" y="70" width="64" height="30" rx="10" fill="url(#g)"/><text x="406" y="91" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">SRT</text>
    <text x="374" y="130" font-size="17" font-weight="700" fill="#111827">Subtitles</text>
