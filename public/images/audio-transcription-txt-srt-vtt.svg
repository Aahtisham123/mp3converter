      <text x="374" y="246">2</text><text x="374" y="264" fill="#7c3aed">00:00:04,200 --&gt; 00:00:09,000</text>
    </g>
    <g filter="url(#s)"><rect x="650" y="46" width="260" height="236" rx="24" fill="#fff"/></g>
    <rect x="674" y="70" width="64" height="30" rx="10" fill="url(#g)"/><text x="706" y="91" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">VTT</text>
    <text x="674" y="130" font-size="17" font-weight="700" fill="#111827">Web captions</text>
