<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="t d">
  <title id="t">YouTube to MP4 downloader</title>
  <desc id="d">A pasted video link is converted into an MP4 video file in 1080p HD with sound.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6d5dfc" flood-opacity=".15"/></filter>
  </defs>
  <rect width="960" height="340" rx="28" fill="#f7f6ff"/>
  <path d="M0 260c160-50 300 30 480 6s300-60 480-14v88H0z" fill="#ece8ff"/>
  <g fill="#c7c9f5"><circle cx="56" cy="40" r="3"/><circle cx="80" cy="40" r="3"/><circle cx="56" cy="64" r="3"/><circle cx="80" cy="64" r="3"/></g>

  <!-- link card -->
  <g filter="url(#s)"><rect x="60" y="96" width="330" height="148" rx="24" fill="#fff"/></g>
  <text x="86" y="136" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Paste a video link</text>
  <rect x="84" y="152" width="282" height="44" rx="22" fill="#f3efff"/>
  <path d="M104 177a6 6 0 0 0 8 0l5-5a6 6 0 0 0-8-8l-1 1m4 4a6 6 0 0 0-8 0l-5 5a6 6 0 0 0 8 8l1-1" stroke="#7c3aed" stroke-width="2.4" fill="none" stroke-linecap="round" transform="translate(4 -1)"/>
  <text x="132" y="179" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6b7280">youtu.be/…</text>
  <rect x="290" y="158" width="68" height="32" rx="16" fill="url(#g)"/>
  <text x="324" y="179" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">MP4</text>
  <rect x="84" y="212" width="90" height="16" rx="8" fill="#ede9fe"/>
  <rect x="182" y="212" width="60" height="16" rx="8" fill="#ede9fe"/>

  <!-- arrow -->
  <g stroke="#c4b5fd" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" fill="none"><path d="M400 170h52"/><path d="M548 170h52"/></g>
  <circle cx="500" cy="170" r="58" fill="#a78bfa" opacity=".25"/>
  <circle cx="500" cy="170" r="44" fill="url(#g)"/>
  <path d="M500 148v40m-15-15 15 15 15-15" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- mp4 video card -->
  <g filter="url(#s)"><rect x="610" y="56" width="290" height="228" rx="24" fill="#fff"/></g>
  <rect x="632" y="78" width="246" height="138" rx="16" fill="#1f2937"/>
  <rect x="632" y="78" width="246" height="138" rx="16" fill="url(#g)" opacity=".45"/>
  <g fill="#fff" opacity=".9"><rect x="640" y="86" width="10" height="7" rx="2"/><rect x="640" y="200" width="10" height="7" rx="2"/><rect x="860" y="86" width="10" height="7" rx="2"/><rect x="860" y="200" width="10" height="7" rx="2"/></g>
  <circle cx="755" cy="147" r="28" fill="#fff" opacity=".95"/>
  <path d="M746 133v28l23-14z" fill="#7c3aed"/>
  <rect x="804" y="90" width="62" height="24" rx="8" fill="url(#r)"/>
  <text x="835" y="107" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">1080p</text>
  <text x="755" y="256" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#111827">MP4 · HD with sound</text>
  <path d="M600 110l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#a78bfa"/>
</svg>
