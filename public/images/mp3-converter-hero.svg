<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" role="img" aria-labelledby="t d">
  <title id="t">MP3 Converter illustration</title>
  <desc id="d">Audio and video files such as MP4, WAV, M4A and FLAC flow into a converter and come out as a downloadable MP3 file.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#f3efff"/>
    </linearGradient>
    <linearGradient id="blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e8ff"/>
      <stop offset="1" stop-color="#ece4ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#6d5dfc" flood-opacity=".14"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1100" height="800" rx="36" fill="url(#bg)"/>
  <path d="M0 0h360c-30 90-150 140-250 120C60 110 20 150 0 170z" fill="url(#blob)"/>
  <path d="M1100 0v260c-70 10-130-40-150-110C935 90 880 40 820 0z" fill="url(#blob)"/>
  <path d="M0 800V640c120-40 260 10 330 90 20 25 30 50 34 70z" fill="url(#blob)"/>
  <path d="M1100 800H760c60-70 200-110 340-90z" fill="url(#blob)"/>
  <g fill="#c7c9f5">
    <circle cx="60" cy="60" r="3"/><circle cx="90" cy="60" r="3"/><circle cx="120" cy="60" r="3"/>
    <circle cx="60" cy="90" r="3"/><circle cx="90" cy="90" r="3"/><circle cx="120" cy="90" r="3"/>
    <circle cx="980" cy="720" r="3"/><circle cx="1010" cy="720" r="3"/><circle cx="1040" cy="720" r="3"/>
    <circle cx="980" cy="750" r="3"/><circle cx="1010" cy="750" r="3"/><circle cx="1040" cy="750" r="3"/>
  </g>

  <text x="550" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="800" fill="#111827">MP3 <tspan fill="url(#brand)">Converter</tspan></text>

  <!-- Input card -->
  <g filter="url(#sh)">
    <rect x="70" y="260" width="300" height="200" rx="26" fill="#fff"/>
  </g>
  <rect x="92" y="282" width="256" height="156" rx="18" fill="none" stroke="#c7d2fe" stroke-width="2" stroke-dasharray="8 8"/>
  <g filter="url(#sh)">
    <rect x="175" y="226" width="90" height="62" rx="31" fill="url(#brand)"/>
  </g>
  <path d="M220 270v-26m-11 11l11-11 11 11" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="url(#wave)" stroke-width="5" stroke-linecap="round">
    <line x1="120" y1="360" x2="120" y2="370"/><line x1="134" y1="350" x2="134" y2="380"/>
    <line x1="148" y1="340" x2="148" y2="390"/><line x1="162" y1="355" x2="162" y2="375"/>
    <line x1="176" y1="330" x2="176" y2="400"/><line x1="190" y1="345" x2="190" y2="385"/>
    <line x1="204" y1="322" x2="204" y2="408"/><line x1="218" y1="340" x2="218" y2="390"/>
    <line x1="232" y1="352" x2="232" y2="378"/><line x1="246" y1="332" x2="246" y2="398"/>
    <line x1="260" y1="346" x2="260" y2="384"/><line x1="274" y1="356" x2="274" y2="374"/>
    <line x1="288" y1="340" x2="288" y2="390"/><line x1="302" y1="352" x2="302" y2="378"/>
    <line x1="316" y1="360" x2="316" y2="370"/>
  </g>

  <!-- Format tiles -->
  <g font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#4b5563" text-anchor="middle">
    <g filter="url(#sh)">
      <rect x="70" y="490" width="66" height="66" rx="16" fill="#fff"/>
      <rect x="148" y="490" width="66" height="66" rx="16" fill="#fff"/>
      <rect x="226" y="490" width="66" height="66" rx="16" fill="#fff"/>
      <rect x="304" y="490" width="66" height="66" rx="16" fill="#fff"/>
      <rect x="70" y="600" width="66" height="66" rx="16" fill="#fff"/>
      <rect x="148" y="600" width="66" height="66" rx="16" fill="#fff"/>
      <rect x="226" y="600" width="66" height="66" rx="16" fill="#fff"/>
      <rect x="304" y="600" width="66" height="66" rx="16" fill="#fff"/>
    </g>
    <!-- MP4 video -->
    <rect x="88" y="511" width="22" height="24" rx="5" fill="url(#brand)"/><path d="M112 517l10-6v24l-10-6z" fill="url(#brand)"/>
    <text x="103" y="580">MP4</text>
    <!-- WAV wave -->
    <path d="M160 523h6l4-10 6 22 6-18 4 6h10" stroke="url(#brand)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="181" y="580">WAV</text>
    <!-- M4A note -->
    <path d="M253 534v-22l18-4v20" stroke="url(#brand)" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="248" cy="534" r="6" fill="url(#brand)"/><circle cx="266" cy="528" r="6" fill="url(#brand)"/>
    <text x="259" y="580">M4A</text>
    <!-- FLAC -->
    <rect x="324" y="508" width="26" height="30" rx="5" fill="none" stroke="url(#brand)" stroke-width="4"/><path d="M331 518h12m-12 8h8" stroke="url(#brand)" stroke-width="4" stroke-linecap="round"/>
    <text x="337" y="580">FLAC</text>
    <!-- Mic -->
    <rect x="96" y="612" width="14" height="24" rx="7" fill="url(#brand)"/><path d="M91 630a12 12 0 0 0 24 0m-12 12v6" stroke="url(#brand)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <text x="103" y="690">Voice</text>
    <!-- MOV -->
    <rect x="164" y="614" width="34" height="26" rx="5" fill="none" stroke="url(#brand)" stroke-width="4"/><path d="M177 621l9 6-9 6z" fill="url(#brand)"/>
    <text x="181" y="690">MOV</text>
    <!-- Podcast -->
    <circle cx="259" cy="628" r="5" fill="url(#brand)"/><path d="M249 638a14 14 0 1 1 20 0m-26 6a22 22 0 1 1 32 0" stroke="url(#brand)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <text x="259" y="690">Podcast</text>
    <!-- OGG / WEBM -->
    <path d="M323 627h4m6-10v20m8-26v32m8-22v12m6-6h4" stroke="url(#brand)" stroke-width="4" stroke-linecap="round"/>
    <text x="337" y="690">WEBM</text>
  </g>

  <!-- Flow -->
  <g stroke="url(#wave)" stroke-width="5" stroke-linecap="round">
    <line x1="400" y1="388" x2="400" y2="400"/><line x1="414" y1="376" x2="414" y2="412"/>
    <line x1="428" y1="366" x2="428" y2="422"/><line x1="442" y1="380" x2="442" y2="408"/>
    <line x1="456" y1="356" x2="456" y2="432"/><line x1="470" y1="372" x2="470" y2="416"/>
  </g>
  <path d="M378 394h14m-6-6l6 6-6 6" stroke="#8b5cf6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center converter orb -->
  <circle cx="550" cy="394" r="92" fill="#a78bfa" opacity=".35" filter="url(#glow)"/>
  <circle cx="550" cy="394" r="76" fill="#fff" opacity=".8"/>
  <circle cx="550" cy="394" r="60" fill="url(#brand)"/>
  <path d="M523 380a30 30 0 0 1 52-8m4 0v-14m0 14h-14M577 408a30 30 0 0 1-52 8m-4 0v14m0-14h14" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <g stroke="url(#wave)" stroke-width="5" stroke-linecap="round">
    <line x1="630" y1="380" x2="630" y2="408"/><line x1="644" y1="366" x2="644" y2="422"/>
    <line x1="658" y1="376" x2="658" y2="412"/><line x1="672" y1="358" x2="672" y2="430"/>
    <line x1="686" y1="374" x2="686" y2="414"/><line x1="700" y1="386" x2="700" y2="402"/>
  </g>
  <path d="M712 394h14m-6-6l6 6-6 6" stroke="#8b5cf6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Output card -->
  <g filter="url(#sh)">
    <rect x="740" y="230" width="290" height="380" rx="26" fill="#fff"/>
  </g>
  <text x="768" y="278" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Your MP3 files</text>
  <line x1="740" y1="300" x2="1030" y2="300" stroke="#eef0f6" stroke-width="2"/>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="760" y="318" width="250" height="78" rx="14" fill="#f6f7fb"/>
    <rect x="776" y="334" width="46" height="46" rx="12" fill="url(#brand)"/>
    <text x="799" y="363" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">MP3</text>
    <rect x="836" y="342" width="120" height="10" rx="5" fill="#d9dbe6"/>
    <rect x="836" y="362" width="80" height="8" rx="4" fill="#e7e8ef"/>
    <text x="992" y="370" text-anchor="end" font-size="13" font-weight="700" fill="#8b5cf6">320k</text>

    <rect x="760" y="408" width="250" height="78" rx="14" fill="#f6f7fb"/>
    <rect x="776" y="424" width="46" height="46" rx="12" fill="url(#brand)"/>
    <text x="799" y="453" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">MP3</text>
    <rect x="836" y="432" width="104" height="10" rx="5" fill="#d9dbe6"/>
    <rect x="836" y="452" width="70" height="8" rx="4" fill="#e7e8ef"/>
    <text x="992" y="460" text-anchor="end" font-size="13" font-weight="700" fill="#8b5cf6">192k</text>

    <rect x="760" y="498" width="250" height="78" rx="14" fill="#f6f7fb"/>
    <rect x="776" y="514" width="46" height="46" rx="12" fill="url(#brand)"/>
    <text x="799" y="543" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">MP3</text>
    <rect x="836" y="522" width="128" height="10" rx="5" fill="#d9dbe6"/>
    <rect x="836" y="542" width="60" height="8" rx="4" fill="#e7e8ef"/>
    <text x="992" y="550" text-anchor="end" font-size="13" font-weight="700" fill="#8b5cf6">128k</text>
  </g>
  <!-- Download badge -->
  <g filter="url(#sh)">
    <circle cx="1010" cy="600" r="44" fill="url(#brand)"/>
  </g>
  <path d="M1010 580v30m-12-12l12 12 12-12m-24 20h24" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1062 548l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#a78bfa"/>
  <path d="M1076 520l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" fill="#c4b5fd"/>
</svg>
