<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
  <title id="t">How to cut an MP3</title>
  <desc id="d">Four steps: add audio (MP3, WAV, M4A…), select (Drag the handles), cut (Fade in or out), download (Save your clip).</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="gh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6d5dfc" flood-opacity=".15"/></filter>
  </defs>
  <rect width="960" height="300" rx="28" fill="#f7f6ff"/>
  <path d="M0 230c140-40 260 30 420 10s280-70 540-20v80H0z" fill="#ece8ff"/>
  <g stroke="#c4b5fd" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"><path d="M250 145h30M480 145h30M710 145h30"/></g>
  <g font-family="Inter, Arial, sans-serif">
  <g filter="url(#s)"><rect x="40" y="50" width="200" height="190" rx="24" fill="#fff"/></g>
    <circle cx="140" cy="118" r="38" fill="url(#g)"/>
    <path d="M126 126a12 12 0 0 1 2-23 16 16 0 0 1 30 4 10 10 0 0 1-1 19M140 130v-18m-7 7 7-7 7 7" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="140" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">1. Add audio</text>
    <text x="140" y="215" text-anchor="middle" font-size="14" fill="#6b7280">MP3, WAV, M4A…</text>
<g filter="url(#s)"><rect x="270" y="50" width="200" height="190" rx="24" fill="#fff"/></g>
    <circle cx="370" cy="118" r="38" fill="url(#g)"/>
    <path d="M350 118h40" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="358" y="102" width="24" height="32" rx="4" fill="#fff" opacity=".35"/><path d="M358 100v36M382 100v36" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="370" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">2. Select</text>
    <text x="370" y="215" text-anchor="middle" font-size="14" fill="#6b7280">Drag the handles</text>
<g filter="url(#s)"><rect x="500" y="50" width="200" height="190" rx="24" fill="#fff"/></g>
    <circle cx="600" cy="118" r="38" fill="url(#g)"/>
    <circle cx="590" cy="108" r="6" fill="none" stroke="#fff" stroke-width="3.5"/><circle cx="590" cy="128" r="6" fill="none" stroke="#fff" stroke-width="3.5"/><path d="M595 113l20 18M595 123l20-18" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="600" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">3. Cut</text>
    <text x="600" y="215" text-anchor="middle" font-size="14" fill="#6b7280">Fade in or out</text>
<g filter="url(#s)"><rect x="730" y="50" width="200" height="190" rx="24" fill="#fff"/></g>
    <circle cx="830" cy="118" r="38" fill="url(#g)"/>
    <path d="M830 100v28m-11-11 11 11 11-11M816 138h28" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="830" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">4. Download</text>
    <text x="830" y="215" text-anchor="middle" font-size="14" fill="#6b7280">Save your clip</text>
