<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="t d">
  <title id="t">Online video downloader on any device</title>
  <desc id="d">A phone, a laptop and a tablet each playing a downloaded MP4 video in the browser.</desc>
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6d5dfc" flood-opacity=".16"/></filter>
    <g id="vid">
      <rect x="-56" y="-34" width="112" height="68" rx="10" fill="url(#b)"/>
      <circle r="15" fill="#fff" opacity=".95"/>
      <path d="M-5 -8v16l13-8z" fill="#7c3aed"/>
    </g>
    <g id="ok"><circle r="16" fill="#10b981"/><path d="M-7 0l5 5 9-10" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>
  <rect width="960" height="340" rx="28" fill="#f7f6ff"/>
  <path d="M0 262c160-40 300 26 480 4s300-56 480-10v84H0z" fill="#ece8ff"/>

  <!-- phone -->
  <g filter="url(#s)"><rect x="90" y="40" width="160" height="270" rx="28" fill="#111827"/></g>
  <rect x="100" y="50" width="140" height="250" rx="20" fill="#fff"/>
  <rect x="146" y="58" width="48" height="12" rx="6" fill="#111827"/>
  <text x="170" y="104" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Phone</text>
  <use href="#vid" x="170" y="160"/>
  <text x="170" y="226" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">film.mp4</text>
  <use href="#ok" x="236" y="54"/>

  <!-- laptop -->
  <g filter="url(#s)">
    <rect x="330" y="70" width="300" height="190" rx="16" fill="#111827"/>
    <path d="M300 262h360l-20 22H320z" fill="#d9dcea"/>
  </g>
  <rect x="342" y="82" width="276" height="166" rx="8" fill="#fff"/>
  <rect x="342" y="82" width="276" height="26" rx="8" fill="#f3efff"/>
  <g fill="#c4b5fd"><circle cx="358" cy="95" r="4"/><circle cx="372" cy="95" r="4"/><circle cx="386" cy="95" r="4"/></g>
  <use href="#vid" transform="translate(480 166) scale(1.35)"/>
  <rect x="380" y="226" width="200" height="5" rx="2.5" fill="#ede9fe"/>
  <rect x="380" y="226" width="140" height="5" rx="2.5" fill="#7c3aed"/>
  <use href="#ok" x="626" y="74"/>

  <!-- tablet -->
  <g filter="url(#s)"><rect x="690" y="60" width="210" height="230" rx="22" fill="#374151"/></g>
  <rect x="702" y="72" width="186" height="206" rx="12" fill="#fff"/>
  <text x="795" y="110" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Tablet</text>
  <use href="#vid" transform="translate(795 170) scale(1.15)"/>
  <text x="795" y="240" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">lecture.mp4</text>
  <use href="#ok" x="896" y="64"/>
</svg>
