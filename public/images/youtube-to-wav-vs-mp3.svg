<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d">
  <title id="t">YouTube to WAV vs MP3</title>
  <desc id="d">WAV keeps the full uncompressed waveform at about 10 MB per minute, while MP3 is compressed to about 1.4 MB per minute.</desc>
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6d5dfc" flood-opacity=".13"/></filter>
  </defs>
  <rect width="960" height="330" rx="28" fill="#f7f6ff"/>
  <g filter="url(#s)">
    <rect x="40" y="36" width="420" height="258" rx="24" fill="#fff"/>
    <rect x="500" y="36" width="420" height="258" rx="24" fill="#fff"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="68" y="62" width="70" height="28" rx="9" fill="url(#b)"/>
    <text x="103" y="81" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">WAV</text>
    <text x="152" y="82" font-size="17" font-weight="700" fill="#111827">Lossless, for editing</text>
    <g stroke="url(#b)" stroke-width="6" stroke-linecap="round">
      <path d="M80 170v10M96 152v46M112 136v78M128 158v34M144 124v102M160 146v58M176 162v26M192 130v90M208 118v114M224 144v62M240 160v30M256 134v82M272 150v50M288 166v18M304 140v70M320 128v94M336 152v46M352 164v22M368 138v74M384 154v42M400 168v14M416 146v58M432 160v30"/>
    </g>
    <text x="68" y="262" font-size="15" fill="#4b5563"><tspan font-weight="800" fill="#111827">≈ 10 MB</tspan> per minute · full detail kept</text>

    <rect x="528" y="62" width="70" height="28" rx="9" fill="#e5e7eb"/>
    <text x="563" y="81" text-anchor="middle" font-size="15" font-weight="800" fill="#4b5563">MP3</text>
    <text x="612" y="82" font-size="17" font-weight="700" fill="#111827">Compressed, for listening</text>
    <g stroke="#c4b5fd" stroke-width="6" stroke-linecap="round">
      <path d="M540 170v10M572 148v54M604 132v86M636 150v50M668 124v102M700 144v62M732 136v78M764 154v42M796 128v94M828 146v58M860 158v34M892 166v18"/>
    </g>
    <text x="528" y="262" font-size="15" fill="#4b5563"><tspan font-weight="800" fill="#111827">≈ 1.4 MB</tspan> per minute · smaller files</text>
  </g>
</svg>
