<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
  <title id="t">How to convert YouTube to MP3</title>
  <desc id="d">Four steps: copy the video link, paste it, convert to MP3, then download the file.</desc>
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6d5dfc" flood-opacity=".13"/></filter>
  </defs>
  <rect width="960" height="300" rx="28" fill="#f7f6ff"/>
  <path d="M0 230c140-40 260 30 420 10s280-70 540-20v80H0z" fill="#ece8ff"/>
  <g stroke="#c4b5fd" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"><path d="M250 145h30M480 145h30M710 145h30"/></g>
  <g filter="url(#s)">
    <rect x="40" y="50" width="200" height="190" rx="24" fill="#fff"/>
    <rect x="270" y="50" width="200" height="190" rx="24" fill="#fff"/>
    <rect x="500" y="50" width="200" height="190" rx="24" fill="#fff"/>
    <rect x="730" y="50" width="200" height="190" rx="24" fill="#fff"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <circle cx="140" cy="118" r="38" fill="url(#b)"/>
    <path d="M132 126a8 8 0 0 0 11 0l7-7a8 8 0 0 0-11-11l-2 2m6 6a8 8 0 0 0-11 0l-7 7a8 8 0 0 0 11 11l2-2" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" transform="translate(4 -3)"/>
    <text x="140" y="190" font-size="20" font-weight="700" fill="#111827">1. Copy link</text>
    <text x="140" y="215" font-size="14" fill="#6b7280">Tap Share, Copy link</text>

    <circle cx="370" cy="118" r="38" fill="url(#b)"/>
    <rect x="355" y="100" width="30" height="38" rx="5" fill="none" stroke="#fff" stroke-width="4"/>
    <rect x="362" y="95" width="16" height="9" rx="3" fill="#fff"/>
    <path d="M362 116h16M362 126h10" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="370" y="190" font-size="20" font-weight="700" fill="#111827">2. Paste</text>
    <text x="370" y="215" font-size="14" fill="#6b7280">Pick up to 320 kbps</text>

    <circle cx="600" cy="118" r="38" fill="url(#b)"/>
    <circle cx="600" cy="118" r="22" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="5"/>
    <path d="M600 96a22 22 0 1 1-22 22" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="600" y="123" font-size="12" font-weight="800" fill="#fff">75%</text>
    <text x="600" y="190" font-size="20" font-weight="700" fill="#111827">3. Convert</text>
    <text x="600" y="215" font-size="14" fill="#6b7280">Watch the circle fill</text>

    <circle cx="830" cy="118" r="38" fill="url(#b)"/>
    <path d="M830 100v28m-11-11 11 11 11-11M816 138h28" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="830" y="190" font-size="20" font-weight="700" fill="#111827">4. Download</text>
    <text x="830" y="215" font-size="14" fill="#6b7280">Save your MP3</text>
  </g>
</svg>
