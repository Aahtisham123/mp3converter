<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d">
  <title id="t">YouTube to MP3 quality from 64 to 320 kbps</title>
  <desc id="d">Bars compare MP3 bitrates: 64 kbps for speech, 128 for podcasts, 192 for most videos, 256 for music and 320 kbps for the best quality.</desc>
  <defs>
    <linearGradient id="b" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="soft" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#c7d2fe"/><stop offset="1" stop-color="#ddd6fe"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6d5dfc" flood-opacity=".13"/></filter>
  </defs>
  <rect width="960" height="330" rx="28" fill="#f7f6ff"/>
  <g filter="url(#s)"><rect x="40" y="30" width="880" height="270" rx="24" fill="#fff"/></g>
  <path d="M80 240h800" stroke="#e8eaf2" stroke-width="2"/>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="125" y="196" width="90" height="44" rx="12" fill="url(#soft)"/>
    <rect x="290" y="168" width="90" height="72" rx="12" fill="url(#soft)"/>
    <rect x="455" y="136" width="90" height="104" rx="12" fill="url(#soft)"/>
    <rect x="620" y="104" width="90" height="136" rx="12" fill="url(#soft)"/>
    <rect x="785" y="66" width="90" height="174" rx="12" fill="url(#b)"/>
    <text x="170" y="186" font-size="18" font-weight="800" fill="#4b5563">64</text>
    <text x="335" y="158" font-size="18" font-weight="800" fill="#4b5563">128</text>
    <text x="500" y="126" font-size="18" font-weight="800" fill="#4b5563">192</text>
    <text x="665" y="94" font-size="18" font-weight="800" fill="#4b5563">256</text>
    <text x="830" y="160" font-size="22" font-weight="800" fill="#fff">320</text>
    <text x="830" y="182" font-size="12" font-weight="600" fill="#fff">kbps</text>
    <text x="170" y="266" font-size="15" font-weight="600" fill="#111827">Speech</text>
    <text x="335" y="266" font-size="15" font-weight="600" fill="#111827">Podcasts</text>
    <text x="500" y="266" font-size="15" font-weight="600" fill="#111827">Most videos</text>
    <text x="665" y="266" font-size="15" font-weight="600" fill="#111827">Music</text>
    <text x="830" y="266" font-size="15" font-weight="700" fill="#7c3aed">Best quality</text>
  </g>
  <text x="80" y="66" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#111827">MP3 bitrate (kbps)</text>
  <path d="M760 56l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#a78bfa"/>
</svg>
